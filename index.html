<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mera Bio Data</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #fff;
            width: 100%;
            max-width: 420px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            text-align: center;
            padding: 30px 20px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #fff;
            color: #764ba2;
            font-size: 44px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 12px;
            border: 4px solid rgba(255,255,255,0.5);
        }

        .header h1 {
            font-size: 22px;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .info {
            padding: 20px 25px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed #ddd;
            font-size: 14px;
        }

        .row:last-child {
            border-bottom: none;
        }

        .label {
            font-weight: 600;
            color: #764ba2;
        }

        .value {
            color: #444;
            text-align: right;
        }

        .footer {
            text-align: center;
            padding: 15px;
            background: #f7f7fb;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <div class="avatar">R</div>
            <h1> Sharma</h1>
            <p>Web</p>
        </div>

        <div class="info">
            <div class="row">
                <span class="label">Naam</span>
                <span class="value">Rahul Sharma</span>
            </div>
            <div class="row">
                <span class="label">Umar</span>
                <span class="value">22 Saal</span>
            </div>
            <div class="row">
                <span class="label">Janm Tithi</span>
                <span class="value">15 Aug 2003</span>
            </div>
            <div class="row">
                <span class="label">Ling</span>
                <span class="value">Purush</span>
            </div>
            <div class="row">
                <span class="label">Shiksha</span>
                <span class="value">B.Tech (CSE)</span>
            </div>
            <div class="row">
                <span class="label">Mobile</span>
                <span class="value">+91 98765 43210</span>
            </div>
            <div class="row">
                <span class="label">Email</span>
                <span class="value">rahul@email.com</span>
            </div>
            <div class="row">
                <span class="label">Pata</span>
                <span class="value">Delhi, India</span>
            </div>
            <div class="row">
                <span class="label">Rashtriyata</span>
                <span class="value">Bharatiya</span>
            </div>
        </div>

        <div class="footer">
            © 2025 Mera Bio Data
        </div>
    </div>

</body>
</html>
